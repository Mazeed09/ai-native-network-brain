apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-app
  template:
    metadata:
      labels:
        app: edge-app
    spec:
      containers:
        - name: edge-app
          image: python:3.11-slim
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-app
  template:
    metadata:
      labels:
        app: cloud-app
    spec:
      containers:
        - name: cloud-app
          image: python:3.11-slim
          command: ["python", "-m", "http.server", "8081"]
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: edge-app
spec:
  selector:
    app: edge-app
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-app
spec:
  selector:
    app: cloud-app
  ports:
    - port: 8081
      targetPort: 8081
